baseURL = "https://neagaru.com/"
title = "Daniel Neagaru"
theme = "neagaru"
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

[params]
  description = "Security audits, systems automation, and time modeling – by Daniel Neagaru, penetration tester and creator of UTMS and OWASP Raider"
  author = "Daniel Neagaru"
  site_logo = "images/logo.png"

[outputs]
  home = ["HTML", "RSS"]
  sitemap = ["sitemap"]

[languages]

  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    weight = 1
    contentDir = "content/en"

    [languages.en.params]
      flag = "🇺🇸"

      [[languages.en.menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 10 
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 20 
      [[languages.en.menu.main]]
        identifier = "services"
        name = "Services"
        url = "/services/"
        weight = 30 
      [[languages.en.menu.main]]
        identifier = "portfolio"
        name = "Portfolio"
        url = "/portfolio/"
        weight = 40 
      [[languages.en.menu.main]]
        identifier = "blog"
        name = "Blog"
        url = "/blog/"
        weight = 50 
      [[languages.en.menu.main]]
        identifier = "contact"
        name = "Contact"
        url = "/contact/"
        weight = 60 
      
      [[languages.en.menu.main]]
        identifier = "skills"
        name = "Skills"
        url = "/skills/"
        parent = "about" 
        weight = 1
      [[languages.en.menu.main]]
        identifier = "companies"
        name = "Companies"
        url = "/companies/"
        parent = "about" 
        weight = 2
      [[languages.en.menu.main]]
        identifier = "testimonials"
        name = "Testimonials"
        url = "/testimonials/"
        parent = "about"
        weight = 3
      

